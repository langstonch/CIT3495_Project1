# Unit tests, Trivy, then multi-arch images on GHCR.
# Packages permission: repo Settings -> Actions -> General -> Workflow permissions -> Read and write.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install -r auth/requirements.txt -r analytics/requirements.txt

      - name: Auth tests
        working-directory: auth
        run: pytest -q

      - name: Analytics tests
        working-directory: analytics
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enter Data tests
        working-directory: enterdata
        run: |
          npm ci
          npm test

      - name: Show Results tests
        working-directory: showresults
        run: |
          npm ci
          npm test

  images:
    name: ${{ matrix.service }} image
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: auth
          - service: enterdata
            context: enterdata
          - service: analytics
            context: analytics
          - service: showresults
            context: showresults
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image coordinates
        id: names
        shell: bash
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single-arch load so Trivy can read a local image. Multi-arch push is the next build.
      - name: Build linux/amd64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: local/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Evidence C4. Exit 0 so HIGH findings are reviewed in the artifact instead of failing the job.
      - name: Trivy report (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: table
          output: trivy-${{ matrix.service }}.txt
          exit-code: "0"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln

      # Fail only when a CRITICAL CVE has a vendor fix. Unfixed base-image CVEs stay in the report above.
      - name: Trivy gate (fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library
          scanners: vuln

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt
          if-no-files-found: warn

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push linux/amd64 and linux/arm64
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ steps.names.outputs.repo }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.repo }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
